[project]
name = "pku-elective-captcha"
version = "0.1.0"
description = "Dataset preparation and Colab training workflow for PKU Elective CAPTCHA OCR"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ddddocr>=1.6.1",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18",
    "opencv-python>=5.0.0.93",
    "pillow>=10",
    "requests>=2.31",
    "onnx>=1.16",
    "torch>=2.6",
    "torchvision>=0.21",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
